# 开发环境配置
# 敏感信息通过 .env 文件或环境变量注入，格式: ${ENV_KEY:默认值}
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/minthive?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_DEV_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_DEV_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

# MinIO 本地对象存储配置
# endpoint 为后端访问地址；public-url 为媒体直链的对外地址。
# 两者必须与数据库中已存的媒体 URL 前缀一致，后端才能把旧绝对地址改写为票据代理地址。
minio:
  endpoint: ${MINIO_ENDPOINT:http://26.141.51.0:9000}
  public-url: ${MINIO_PUBLIC_URL:http://100.69.234.20:9000}
  access-key: ${MINIO_DEV_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_DEV_SECRET_KEY:minioadmin}
  bucket: minthive

# JWT 配置
# 签名密钥必须由 .env 或环境变量提供，禁止在源码中保留默认值（缺失时应用启动失败）
jwt:
  secret: ${JWT_DEV_SECRET}
  expire: 604800  # 单位秒，7天
  header: Authorization
  prefix: "Bearer "

# AI 配置 (双模式: cloud / local)
ai:
  mode: cloud  # cloud | local
  cloud:
    base-url: ${AI_CLOUD_DEV_BASE_URL:https://api.longcat.chat/openai}
    api-key: ${AI_CLOUD_DEV_API_KEY:sk-your-openai-api-key}
    model: ${AI_CLOUD_DEV_MODEL:LongCat-2.0}
    timeout: 60000
  local:
    base-url: ${AI_LOCAL_BASE_URL:http://localhost:11434}
    model: ${AI_LOCAL_MODEL:qwen3:7b}
    timeout: 30000
  # 限流：每用户每日AI调用次数
  rate-limit:
    daily: 50
  # 缓存开关
  cache:
    enabled: true
    ttl: 3600
  # 降级开关
  fallback:
    enabled: true
    message: "AI助手暂时休息中，请稍后再试～"

# 防刷限制
rate-limit:
  post-daily: 50      # 每日发帖上限
  comment-daily: 200  # 每日评论上限
  message-daily: 100  # 每日私信上限

# 文件上传限制
file:
  image-max-size: 5          # 单张图片最大MB
  video-max-size: 20         # 视频最大MB
  video-max-duration: 60     # 视频最大时长(秒)

# 本地开发把验证码输出到日志，便于联调；生产必须改为 http 网关
sms:
  log-code: ${SMS_LOG_CODE:true}

# 跨域白名单：本地前端开发地址，多个用逗号分隔，禁止使用 *
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
